---
layout: page
---
{{ content }}
{% if page.email or page.phone or page.address %}
<address>
  {% if page.email %}
  <p><a href="mailto:{{ page.email | escape }}">{{ page.email | escape }}</a></p>
  {% endif %}
  {% if page.phone %}
  <p>{{ page.phone | escape }}</p>
  {% endif %}
  {% if page.address %}
  <p>{{ page.address | escape | newline_to_br }}</p>
  {% endif %}
</address>
{% endif %}

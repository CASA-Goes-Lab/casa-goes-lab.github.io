name: Check clean Jekyll rebuild

on:
  push:
    branches: [FA26redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler: latest
          rubygems: latest
          bundler-cache: true
      - name: Build replacement site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

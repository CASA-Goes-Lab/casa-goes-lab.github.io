title: Casa Góes Lab
description: Controlling Autonomous Systems with Assurances
url: "https://casa-goes-lab.github.io"
baseurl: ""
permalink: pretty

collections:
  team:
    output: false
  news:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page

# Publications page: export BibTeX from Google Scholar into this file.
# Authors on the Team page (current and alumni) are shown in bold; list
# anyone else to bold under `highlight` as "First Last".
publications:
  bibliography: _bibliography/publications.bib
  # scripts/update_publications.rb adds new works by this OpenAlex author.
  openalex_author: A5069939622
  highlight: []

# Lab News on the home page only shows posts from the last `news_months` months.
news_months: 9

exclude:
  - _archive
  - vendor
  - .bundle
  - .github
  - README.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - scripts
